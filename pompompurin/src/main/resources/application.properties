spring.application.name=pompompurin

# Puerto de la API: 8081 por defecto (el 8080 ya lo usa otro proyecto en esta PC).
# Si existe la variable de entorno PORT (la ponen muchos servicios de hosting), se usa esa.
server.port=${PORT:8081}

# Conexion a PostgreSQL en Neon (nube). Los datos vienen de variables de entorno
# o del archivo pompompurin/.env (copiar pompompurin/.env.example como .env y completarlo).
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea/actualiza la tabla "makis" a partir de la entidad Maki
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
