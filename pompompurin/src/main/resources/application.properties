spring.application.name=pompompurin

# Puerto de la API (el 8080 ya lo usa otro proyecto en esta PC)
server.port=8081

# Conexion a PostgreSQL (levantado con docker compose, ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5434/makisdb
spring.datasource.username=maki
spring.datasource.password=maki123

# Hibernate crea/actualiza la tabla "makis" a partir de la entidad Maki
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
