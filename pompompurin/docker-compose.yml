# Backend Spring Boot de la API de makis (la base de datos está en Neon, en la nube)
# Levantar:  docker compose up -d --build
# Apagar:    docker compose down
services:
  backend:
    build: .          # usa el Dockerfile de esta carpeta
    container_name: makis-backend
    env_file: .env    # DB_URL, DB_USERNAME y DB_PASSWORD de Neon (ver .env.example)
    ports:
      - "8081:8081"
