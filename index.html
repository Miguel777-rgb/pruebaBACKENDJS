<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartas de Evaluación — Pompompurin Maki API &amp; Postman</title>
  <style>
    :root {
      --bg: #0b101b;
      --bg-elevated: #111827;
      --card: #151e30;
      --card-2: #1b253b;
      --border: #28354f;
      --border-strong: #3a4c70;
      --text: #eef2ff;
      --muted: #94a3b8;
      --dim: #64748b;

      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --spring: #6db33f;
      --spring-soft: rgba(109, 179, 63, 0.15);
      --postman: #ff6c37;
      --postman-soft: rgba(255, 108, 55, 0.16);
      --blue: #38bdf8;
      --blue-soft: rgba(56, 189, 248, 0.15);
      --ok: #22c55e;
      --ok-soft: rgba(34, 197, 94, 0.15);
      --bad: #ef4444;
      --bad-soft: rgba(239, 68, 68, 0.15);

      --code-bg: #0d1322;
      --code-line: #4b5c7d;
      --code-kw: #c084fc;
      --code-type: #38bdf8;
      --code-ann: #fbbf24;
      --code-str: #86efac;
      --code-num: #fb923c;
      --code-com: #64748b;

      --pm-bg: #1c1c1c;
      --pm-panel: #232323;
      --pm-input: #2b2b2b;
      --pm-border: #383838;
      --pm-text: #ececec;
      --pm-muted: #9b9b9b;

      --shadow: 0 22px 50px rgba(0, 0, 0, 0.45);
      --radius: 18px;
      --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
    }

    html[data-theme="light"] {
      --bg: #f4f6fb;
      --bg-elevated: #ffffff;
      --card: #ffffff;
      --card-2: #f8fafc;
      --border: #dce3f0;
      --border-strong: #bac6dc;
      --text: #0f172a;
      --muted: #475569;
      --dim: #64748b;

      --accent: #d97706;
      --accent-soft: rgba(217, 119, 6, 0.12);
      --spring: #4d8b28;
      --spring-soft: rgba(77, 139, 40, 0.12);
      --postman: #e85826;
      --postman-soft: rgba(232, 88, 38, 0.12);
      --blue: #0284c7;
      --blue-soft: rgba(2, 132, 199, 0.12);
      --ok: #16a34a;
      --ok-soft: rgba(22, 163, 74, 0.12);
      --bad: #dc2626;
      --bad-soft: rgba(220, 38, 38, 0.12);

      --code-bg: #131926;
      --pm-bg: #1f1f22;
      --pm-panel: #27272b;
      --pm-input: #303036;
      --pm-border: #3f3f46;

      --shadow: 0 18px 40px rgba(15, 23, 42, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(245, 158, 11, 0.11), transparent 60%),
        radial-gradient(800px 450px at 95% 0%, rgba(56, 189, 248, 0.09), transparent 55%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 16px 40px;
    }

    .app {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header & Toolbar */
    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #ea580c);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--card-2);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stat-pill.ok { border-color: rgba(34, 197, 94, 0.4); color: var(--ok); background: var(--ok-soft); }
    .stat-pill.streak { border-color: rgba(245, 158, 11, 0.4); color: var(--accent); background: var(--accent-soft); }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .filter-group, .action-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .mode-switch {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 3px;
      gap: 3px;
    }

    .mode-switch button {
      border: none;
      background: transparent;
      padding: 6px 11px;
      border-radius: 8px;
      color: var(--muted);
    }

    .mode-switch button.active {
      background: var(--accent);
      color: #111827;
      font-weight: 700;
    }

    /* Progress Bar */
    .progress-wrap {
      width: 100%;
      height: 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--spring));
      transition: width 0.3s ease;
    }

    /* Main Flashcard / Quiz Card */
    .study-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      padding: 14px 20px;
      background: var(--card-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .badge-code { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(56, 189, 248, 0.35); }
    .badge-postman { background: var(--postman-soft); color: var(--postman); border: 1px solid rgba(255, 108, 55, 0.38); }
    .badge-arch { background: var(--spring-soft); color: var(--spring); border: 1px solid rgba(109, 179, 63, 0.38); }
    .badge-diff { background: var(--bg-elevated); color: var(--muted); border: 1px solid var(--border); }
    .badge-status-ok { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-status-bad { background: var(--bad-soft); color: var(--bad); border: 1px solid rgba(239, 68, 68, 0.4); }

    .card-counter {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .card-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr);
      gap: 0;
    }

    @media (max-width: 920px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }

    .evidence-pane {
      padding: 20px;
      border-right: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.14);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    @media (max-width: 920px) {
      .evidence-pane {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }

    .evidence-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
      flex-wrap: wrap;
    }

    .pointer-legend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    /* IDE Code Block */
    .ide-window {
      background: var(--code-bg);
      border: 1px solid #26334d;
      border-radius: 14px;
      overflow: hidden;
      color: #e2e8f0;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .ide-titlebar {
      background: #141c2f;
      border-bottom: 1px solid #23304a;
      padding: 8px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: #94a3b8;
    }

    .window-dots {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.r { background: #ef4444; }
    .dot.y { background: #f59e0b; }
    .dot.g { background: #22c55e; }

    .code-body {
      padding: 10px 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .code-line {
      display: flex;
      align-items: baseline;
      padding: 1px 14px 1px 10px;
      white-space: pre;
      position: relative;
      border-left: 3px solid transparent;
    }

    .code-line.focused {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.22), rgba(245, 158, 11, 0.05));
      border-left-color: #f59e0b;
    }

    .ln {
      width: 34px;
      flex-shrink: 0;
      text-align: right;
      padding-right: 12px;
      color: var(--code-line);
      user-select: none;
      font-size: 0.74rem;
    }

    .code-line.focused .ln {
      color: #fbbf24;
      font-weight: 700;
    }

    .code-content {
      flex: 1;
      min-width: 0;
    }

    .line-pointer {
      margin-left: 14px;
      background: #f59e0b;
      color: #111827;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 1px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
      vertical-align: middle;
      white-space: nowrap;
    }

    .tok-com { color: var(--code-com); font-style: italic; }
    .tok-str { color: var(--code-str); }
    .tok-ann { color: var(--code-ann); font-weight: 600; }
    .tok-kw  { color: var(--code-kw); font-weight: 600; }
    .tok-type { color: var(--code-type); }
    .tok-num { color: var(--code-num); }
    .tok-key { color: #7dd3fc; }

    /* Postman UI Simulator */
    .postman-ui {
      background: var(--pm-bg);
      border: 1px solid var(--pm-border);
      border-radius: 14px;
      overflow: hidden;
      color: var(--pm-text);
      font-size: 0.8rem;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.42);
    }

    .pm-topbar {
      background: #161618;
      border-bottom: 1px solid var(--pm-border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.74rem;
      color: var(--pm-muted);
    }

    .pm-crumb {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pm-logo {
      color: #ff6c37;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .pm-req-name {
      color: #fff;
      font-weight: 600;
    }

    .pm-request-bar {
      padding: 10px 12px;
      background: var(--pm-panel);
      display: flex;
      align-items: stretch;
      gap: 8px;
      border-bottom: 1px solid var(--pm-border);
    }

    .pm-url-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--pm-input);
      border: 1px solid var(--pm-border);
      border-radius: 8px;
      overflow: visible;
      min-width: 0;
    }

    .pm-method {
      padding: 7px 11px;
      font-weight: 800;
      font-size: 0.76rem;
      border-right: 1px solid var(--pm-border);
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    .pm-method.GET { color: #34d399; }
    .pm-method.POST { color: #fbbf24; }
    .pm-method.PUT { color: #60a5fa; }
    .pm-method.DELETE { color: #f87171; }

    .pm-url {
      padding: 7px 10px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: #f3f4f6;
      white-space: nowrap;
      overflow-x: auto;
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
    }

    .pm-var {
      color: #fb923c;
      background: rgba(251, 146, 60, 0.14);
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 700;
    }

    .pm-send {
      background: #097bed;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .pm-tabs {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      background: var(--pm-panel);
      border-bottom: 1px solid var(--pm-border);
      font-size: 0.75rem;
      overflow-x: auto;
    }

    .pm-tab {
      padding: 8px 2px;
      color: var(--pm-muted);
      border-bottom: 2px solid transparent;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      border-radius: 0;
    }

    .pm-tab:hover { transform: none; color: #fff; }
    .pm-tab.active {
      color: #fff;
      border-bottom-color: #ff6c37;
    }

    .pm-dot-ind {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      margin-left: 4px;
      vertical-align: middle;
    }

    .pm-subbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: #1f1f22;
      border-bottom: 1px solid var(--pm-border);
      font-size: 0.72rem;
      color: var(--pm-muted);
    }

    .pm-radio {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .pm-radio-circle {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid #6b7280;
      display: inline-block;
    }

    .pm-radio.selected {
      color: #fff;
      font-weight: 700;
    }

    .pm-radio.selected .pm-radio-circle {
      border-color: #ff6c37;
      background: radial-gradient(#ff6c37 45%, transparent 50%);
    }

    .pm-lang-pill {
      background: var(--pm-input);
      border: 1px solid var(--pm-border);
      color: #60a5fa;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
    }

    .pm-body-editor {
      background: #19191b;
      padding: 8px 0;
      font-family: var(--font-mono);
      font-size: 0.77rem;
      line-height: 1.55;
      overflow-x: auto;
    }

    .pm-headers-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      background: #19191b;
    }

    .pm-headers-table th, .pm-headers-table td {
      border-bottom: 1px solid var(--pm-border);
      border-right: 1px solid var(--pm-border);
      padding: 6px 10px;
      text-align: left;
    }

    .pm-headers-table th {
      color: var(--pm-muted);
      font-family: var(--font-sans);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pm-response {
      border-top: 2px solid var(--pm-border);
      background: #18181a;
    }

    .pm-res-bar {
      padding: 7px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--pm-border);
      font-size: 0.73rem;
    }

    .pm-res-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .pm-status {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .pm-status.s2xx { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
    .pm-status.s4xx { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .pm-status.pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    /* Highlight ring for Postman targeted UI element */
    .pm-target {
      outline: 2px dashed #f59e0b;
      outline-offset: 2px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.12) !important;
      position: relative;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.16);
    }

    .pm-callout-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f59e0b;
      color: #111827;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
      white-space: nowrap;
    }

    /* Question & Answer Pane */
    .qa-pane {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: space-between;
    }

    .question-text {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: -0.01em;
    }

    .question-text code, .explanation-box code, .option-btn code, .evidence-label code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: rgba(148, 163, 184, 0.16);
      padding: 1px 5px;
      border-radius: 5px;
      color: var(--blue);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 11px 13px;
      border-radius: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 11px;
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text);
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .option-key {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 0.76rem;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--muted);
    }

    .option-btn.correct {
      background: var(--ok-soft);
      border-color: var(--ok);
    }
    .option-btn.correct .option-key {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }

    .option-btn.wrong {
      background: var(--bad-soft);
      border-color: var(--bad);
    }
    .option-btn.wrong .option-key {
      background: var(--bad);
      border-color: var(--bad);
      color: #fff;
    }

    /* Flashcard Flip Mode */
    .flashcard-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {

    const STORAGE_KEY = "pompompurin_eval_cards_v1";

    const state = {
      mode: "quiz", // "quiz" | "flash"
      filter: "all",
      order: CARDS.map(c => c.id),
      currentPos: 0,
      results: {}, // { [cardId]: { status: "ok"|"bad", selectedIndex?: number } }
      flipped: {}, // { [cardId]: boolean }
      streak: 0,
      pmTabOverride: {} // optional user inspection of Postman tabs
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          if (parsed.results) state.results = parsed.results;
          if (typeof parsed.streak === "number") state.streak = parsed.streak;
          if (parsed.mode === "quiz" || parsed.mode === "flash") state.mode = parsed.mode;
        }
      } catch (_) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          results: state.results,
          streak: state.streak,
          mode: state.mode
        }));
      } catch (_) {}
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    const JAVA_KW = new Set([
      "package","import","public","private","protected","class","record","interface",
      "return","new","final","void","for","if","else","true","false","null",
      "double","int","long","cd"
    ]);
    const JAVA_TYPES = new Set([
      "List","ArrayList","Optional","ResponseEntity","Maki","MakiService",
      "MakiController","ControllerDemo","Long","String","Map","HashMap","Object","Date","HttpStatus"
    ]);

    function highlightJavaLine(line) {
      const tokenRe = /(\/\/.*$)|("(?:\\.|[^"\\])*")|(@[A-Za-z_]\w*)|(\b[A-Za-z_]\w*\b)|(\b\d+(?:\.\d+)?\b)|([\s\S])/g;
      let out = "";
      let m;
      while ((m = tokenRe.exec(line)) !== null) {
        if (m[1]) out += `<span class="tok-com">${escapeHtml(m[1])}</span>`;
        else if (m[2]) out += `<span class="tok-str">${escapeHtml(m[2])}</span>`;
        else if (m[3]) out += `<span class="tok-ann">${escapeHtml(m[3])}</span>`;
        else if (m[4]) {
          const w = m[4];
          if (JAVA_KW.has(w)) out += `<span class="tok-kw">${escapeHtml(w)}</span>`;
          else if (JAVA_TYPES.has(w)) out += `<span class="tok-type">${escapeHtml(w)}</span>`;
          else out += escapeHtml(w);
        } else if (m[5]) out += `<span class="tok-num">${escapeHtml(m[5])}</span>`;
        else out += escapeHtml(m[6]);
      }
      return out || " ";
    }

    function highlightJsonLine(line) {
      const tokenRe = /(\/\/.*$)|("(?:\\.|[^"\\])*"(?=\s*:))|("(?:\\.|[^"\\])*")|(\b(?:true|false|null)\b)|(-?\b\d+(?:\.\d+)?\b)|([\s\S])/g;
      let out = "";
      let m;
      while ((m = tokenRe.exec(line)) !== null) {
        if (m[1]) out += `<span class="tok-com">${escapeHtml(m[1])}</span>`;
        else if (m[2]) out += `<span class="tok-key">${escapeHtml(m[2])}</span>`;
        else if (m[3]) out += `<span class="tok-str">${escapeHtml(m[3])}</span>`;
        else if (m[4]) out += `<span class="tok-kw">${escapeHtml(m[4])}</span>`;
        else if (m[5]) out += `<span class="tok-num">${escapeHtml(m[5])}</span>`;
        else out += escapeHtml(m[6]);
      }
      return out || " ";
    }

    function getFilteredCards() {
      const cardMap = new Map(CARDS.map(c => [c.id, c]));
      const ordered = state.order.map(id => cardMap.get(id)).filter(Boolean);
      if (state.filter === "all") return ordered;
      if (state.filter === "missed") {
        return ordered.filter(c => state.results[c.id]?.status === "bad");
      }
      return ordered.filter(c => c.category === state.filter);
    }

    function isCardRevealed(card) {
      if (state.mode === "quiz") return Boolean(state.results[card.id]);
      return Boolean(state.flipped[card.id] || state.results[card.id]);
    }

    function renderCodeEvidence(card) {
      const lines = card.code.split("\n");
      const focusSet = new Set(card.focusLines || []);
      const firstFocus = card.focusLines && card.focusLines[0];

      const linesHtml = lines.map((line, idx) => {
        const lineNum = (card.startLine || 1) + idx;
        const isFocused = focusSet.has(lineNum);
        const showPointer = lineNum === firstFocus && card.pointerText;
        const pointerHtml = showPointer
          ? `<span class="line-pointer">${escapeHtml(card.pointerText)}</span>`
          : "";
        return `
          <div class="code-line ${isFocused ? "focused" : ""}">
            <span class="ln">${lineNum}</span>
            <span class="code-content">${highlightJavaLine(line)}${pointerHtml}</span>
          </div>
        `;
      }).join("");

      return `
        <div class="evidence-label">
          <span>Archivo de referencia en el repositorio</span>
          <span class="pointer-legend">📍 Líneas señaladas en ámbar</span>
        </div>
        <div class="ide-window">
          <div class="ide-titlebar">
            <span class="window-dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></span>
            <span>${escapeHtml(card.file)}</span>
          </div>
          <div class="code-body">${linesHtml}</div>
        </div>
      `;
    }

    function renderPostmanEvidence(card) {
      const pm = card.postman;
      const revealed = isCardRevealed(card);
      const activeTab = state.pmTabOverride[card.id] || pm.activeTab || "Body";

      const urlHtml = pm.urlParts.map(part => {
        const cls = [
          part.isVar ? "pm-var" : "",
          part.target ? "pm-target" : ""
        ].filter(Boolean).join(" ");
        const tag = part.target && part.callout
          ? `<span class="pm-callout-tag">${escapeHtml(part.callout)}</span>`
          : "";
        return `<span class="${cls}">${escapeHtml(part.text)}</span>${tag}`;
      }).join("");

      const bodyLines = pm.bodyLines || [];
      const bodyEditorHtml = bodyLines.length
        ? bodyLines.map((line, i) => {
            const ln = i + 1;
            const isTarget = pm.targetBodyLine === ln;
            const callout = isTarget && pm.bodyLineCallout
              ? `<span class="line-pointer">${escapeHtml(pm.bodyLineCallout)}</span>`
              : "";
            return `
              <div class="code-line ${isTarget ? "focused" : ""}">
                <span class="ln">${ln}</span>
                <span class="code-content">${highlightJsonLine(line)}${callout}</span>
              </div>
            `;
          }).join("")
        : `<div style="padding:14px; color:var(--pm-muted); font-family:var(--font-sans); font-size:0.76rem;">Esta petición no envía cuerpo (<code>none</code>).</div>`;

      const displayHeaders = (pm.headersMasked && !revealed) ? pm.headersMasked : (pm.headers || []);
      const headersRows = displayHeaders.map(h => {
        const rowCls = h.target ? "pm-target" : "";
        const badge = h.target && h.callout
          ? `<span class="pm-callout-tag">${escapeHtml(h.callout)}</span>`
          : "";
        return `
          <tr class="${rowCls}">
            <td style="width:28px; color:#4ade80; text-align:center;">✓</td>
            <td style="color:#93c5fd;">${escapeHtml(h.key)}</td>
            <td style="color:#e5e7eb;">${escapeHtml(h.value)}${badge}</td>
          </tr>
        `;
      }).join("");

      const tabContentHtml = activeTab === "Headers"
        ? `<table class="pm-headers-table">
             <thead><tr><th></th><th>Key</th><th>Value</th></tr></thead>
             <tbody>${headersRows}</tbody>
           </table>`
        : `
          <div class="pm-subbar">
            <span class="pm-radio ${pm.bodyMode === "none" ? "selected" : ""}"><span class="pm-radio-circle"></span> none</span>
            <span class="pm-radio"><span class="pm-radio-circle"></span> form-data</span>
            <span class="pm-radio ${pm.bodyMode === "raw" ? "selected" : ""}"><span class="pm-radio-circle"></span> raw</span>
            ${pm.bodyMode === "raw"
              ? `<span class="pm-lang-pill ${pm.targetZone === "bodyLang" ? "pm-target" : ""}">${escapeHtml(pm.bodyLang || "JSON")} ▾</span>${
                  pm.targetZone === "bodyLang" && pm.bodyCallout
                    ? `<span class="pm-callout-tag">${escapeHtml(pm.bodyCallout)}</span>`
                    : ""
                }`
              : ""}
          </div>
          <div class="pm-body-editor">${bodyEditorHtml}</div>
        `;

      let responseHtml = "";
      if (pm.showResponse) {
        const res = (pm.maskResponseUntilAnswered && !revealed) ? pm.responseMasked : pm.response;
        const statusCls = pm.targetZone === "responseStatus" ? "pm-target" : "";
        const statusCallout = pm.targetZone === "responseStatus" && pm.statusCallout
          ? `<span class="pm-callout-tag">${escapeHtml(pm.statusCallout)}</span>`
          : "";
        const resLines = res.body.split("\n").map((line, idx) => `
          <div class="code-line">
            <span class="ln">${idx + 1}</span>
            <span class="code-content">${highlightJsonLine(line)}</span>
          </div>
        `).join("");

        responseHtml = `
          <div class="pm-response">
            <div class="pm-res-bar">
              <span style="font-weight:700; color:var(--pm-muted);">Response · Pretty (JSON)</span>
              <div class="pm-res-meta">
                <span>Status: <span class="pm-status ${res.statusClass} ${statusCls}">${escapeHtml(res.status)}</span>${statusCallout}</span>
                <span style="color:var(--pm-muted);">Time: <strong style="color:#4ade80;">${escapeHtml(res.time)}</strong></span>
                <span style="color:var(--pm-muted);">Size: <strong style="color:#4ade80;">${escapeHtml(res.size)}</strong></span>
              </div>
            </div>
            <div class="pm-body-editor">${resLines}</div>
          </div>
        `;
      }

      return `
        <div class="evidence-label">
          <span>Simulación UI de Postman (colección <code>endpoints.json</code>)</span>
          <span class="pointer-legend">📍 Elemento señalado en Postman</span>
        </div>
        <div class="postman-ui">
          <div class="pm-topbar">
            <div class="pm-crumb">
              <span class="pm-logo">POSTMAN</span>
              <span>›</span>
              <span>${escapeHtml(pm.collection)}</span>
              <span>›</span>
              <span class="pm-req-name">${escapeHtml(pm.reqName)}</span>
            </div>
            <span>Env: Local / Codespaces</span>
          </div>

          <div class="pm-request-bar">
            <div class="pm-url-box">
              <span class="pm-method ${pm.method}">${pm.method} ▾</span>
              <div class="pm-url">${urlHtml}</div>
            </div>
            <button type="button" class="pm-send" data-pm-send="true" title="Responde la pregunta para evaluar el envío">Send</button>
          </div>

          <div class="pm-tabs">
            <span class="pm-tab" style="cursor:default; opacity:.65;">Params</span>
            <span class="pm-tab" style="cursor:default; opacity:.65;">Authorization</span>
            <button type="button" class="pm-tab ${activeTab === "Headers" ? "active" : ""}" data-pm-tab="Headers">
              Headers (${pm.headersCount || 0})
            </button>
            <button type="button" class="pm-tab ${activeTab === "Body" ? "active" : ""}" data-pm-tab="Body">
              Body ${pm.hasBodyDot ? '<span class="pm-dot-ind"></span>' : ""}
            </button>
          </div>

          ${tabContentHtml}
          ${responseHtml}
        </div>
      `;
    }

    function renderCard() {
      const deck = getFilteredCards();
      const cardBadgesEl = document.getElementById("card-badges");
      const counterEl = document.getElementById("card-counter");
      const evidenceEl = document.getElementById("evidence-pane");
      const qaEl = document.getElementById("qa-pane");

      if (deck.length === 0) {
        cardBadgesEl.innerHTML = `<span class="badge badge-arch">Sin cartas en este filtro</span>`;
        counterEl.textContent = "0 / 0";
        evidenceEl.innerHTML = `<p style="color:var(--muted); margin:0;">No hay cartas pendientes por repasar. ¡Excelente trabajo!</p>`;
        qaEl.innerHTML = `<button class="btn-primary" onclick="setFilter('all')">Volver a todas las cartas</button>`;
        renderDeckDots(deck);
        updateStats();
        return;
      }

      if (state.currentPos >= deck.length) state.currentPos = deck.length - 1;
      if (state.currentPos < 0) state.currentPos = 0;

      const card = deck[state.currentPos];
      const result = state.results[card.id];
      const revealed = isCardRevealed(card);

      // Badges
      const catBadgeClass = card.category === "postman"
        ? "badge-postman"
        : card.category === "arch" ? "badge-arch" : "badge-code";

      let statusBadge = "";
      if (result?.status === "ok") statusBadge = `<span class="badge badge-status-ok">✓ Dominada</span>`;
      else if (result?.status === "bad") statusBadge = `<span class="badge badge-status-bad">↻ Repasar</span>`;

      cardBadgesEl.innerHTML = `
        <span class="badge ${catBadgeClass}">${escapeHtml(card.categoryLabel)}</span>
        <span class="badge badge-diff">${escapeHtml(card.difficulty)}</span>
        ${statusBadge}
      `;
      counterEl.textContent = `Carta ${state.currentPos + 1} / ${deck.length}`;

      // Evidence
      evidenceEl.innerHTML = card.type === "postman"
        ? renderPostmanEvidence(card)
        : renderCodeEvidence(card);

      // Bind Postman interactive inspection tabs
      evidenceEl.querySelectorAll("[data-pm-tab]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.pmTabOverride[card.id] = btn.dataset.pmTab;
          renderCard();
        });
      });
      const sendBtn = evidenceEl.querySelector("[data-pm-send]");
      if (sendBtn) {
        sendBtn.addEventListener("click", () => {
          const hint = qaEl.querySelector(".question-text");
          if (hint) {
            hint.animate([{ opacity: 0.5 }, { opacity: 1 }], { duration: 280 });
          }
        });
      }

      // QA Pane
      let interactionHtml = "";
      if (state.mode === "quiz") {
        const letters = ["A", "B", "C", "D"];
        const optionsHtml = card.options.map((opt, idx) => {
          let cls = "";
          if (result) {
            if (idx === card.correctIndex) cls = "correct";
            else if (idx === result.selectedIndex) cls = "wrong";
          }
          return `
            <button type="button" class="option-btn ${cls}" data-opt-idx="${idx}" ${result ? "disabled" : ""}>
              <span class="option-key">${letters[idx]}</span>
              <span>${opt}</span>
            </button>
          `;
        }).join("");
        interactionHtml = `<div class="options-list">${optionsHtml}</div>`;
      } else {
        if (!revealed) {
          interactionHtml = `
            <div class="flashcard-actions">
              <button type="button" class="btn-primary" id="btn-flip">🔄 Voltear Carta / Ver Respuesta (Espacio)</button>
            </div>
          `;
        } else {
          interactionHtml = `
            <div class="flashcard-actions">
              <div class="self-grade-row">
                <button type="button" class="btn-ok" id="btn-grade-ok">✓ Ya la sabía</button>
                <button type="button" class="btn-bad" id="btn-grade-bad">↻ Marcar para repasar</button>
              </div>
            </div>
          `;
        }
      }

      let expClass = "";
      let expTitle = "";
      if (revealed) {
        if (result?.status === "ok") {
          expClass = "visible state-ok";
          expTitle = "✓ ¡Correcto!";
        } else if (result?.status === "bad") {
          expClass = "visible state-bad";
          expTitle = "✗ Revisa este punto";
        } else {
          expClass = "visible state-info";
          expTitle = `💡 Respuesta: ${escapeHtml(card.answerShort)}`;
        }
      }

      qaEl.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:15px;">
          <h2 class="question-text">${card.question}</h2>
          ${interactionHtml}
        </div>
        <div class="explanation-box ${expClass}">
          <div class="exp-title">
            <span>${expTitle}</span>
          </div>
          <div>${card.explanation}</div>
          <div class="exp-ref">📌 Fuente: ${escapeHtml(card.ref)}</div>
        </div>
      `;

      // Bind quiz options
      qaEl.querySelectorAll("[data-opt-idx]").forEach(btn => {
        btn.addEventListener("click", () => {
          answerQuiz(card, Number(btn.dataset.optIdx));
        });
      });

      const flipBtn = qaEl.querySelector("#btn-flip");
      if (flipBtn) {
        flipBtn.addEventListener("click", () => {
          state.flipped[card.id] = true;
          renderCard();
        });
      }

      const okBtn = qaEl.querySelector("#btn-grade-ok");
      if (okBtn) {
        okBtn.addEventListener("click", () => gradeFlash(card, true));
      }
      const badBtn = qaEl.querySelector("#btn-grade-bad");
      if (badBtn) {
        badBtn.addEventListener("click", () => gradeFlash(card, false));
      }

      document.getElementById("btn-prev").disabled = state.currentPos === 0;
      document.getElementById("btn-next").disabled = state.currentPos >= deck.length - 1;

      renderDeckDots(deck);
      updateStats();
    }

    function answerQuiz(card, selectedIdx) {
      if (state.results[card.id]) return;
      const isOk = selectedIdx === card.correctIndex;
      state.results[card.id] = { status: isOk ? "ok" : "bad", selectedIndex: selectedIdx };
      state.streak = isOk ? state.streak + 1 : 0;
      saveState();
      renderCard();
      if (Object.keys(state.results).length === CARDS.length) {
        showSummary();
      }
    }

    function gradeFlash(card, isOk) {
      state.results[card.id] = { status: isOk ? "ok" : "bad" };
      state.streak = isOk ? state.streak + 1 : 0;
      saveState();
      const deck = getFilteredCards();
      if (state.currentPos < deck.length - 1) {
        state.currentPos++;
      } else if (Object.keys(state.results).length === CARDS.length) {
        showSummary();
      }
      renderCard();
    }

    function renderDeckDots(deck) {
      const container = document.getElementById("deck-dots");
      container.innerHTML = deck.map((c, idx) => {
        const res = state.results[c.id];
        const cls = [
          "deck-num",
          idx === state.currentPos ? "current" : "",
          res?.status === "ok" ? "done-ok" : res?.status === "bad" ? "done-bad" : ""
        ].filter(Boolean).join(" ");
        return `<button type="button" class="${cls}" data-jump="${idx}" title="Ir a carta ${idx + 1}">${idx + 1}</button>`;
      }).join("");

      container.querySelectorAll("[data-jump]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.currentPos = Number(btn.dataset.jump);
          renderCard();
        });
      });
    }

    function updateFilterCounts() {
      const counts = { all: CARDS.length, code: 0, postman: 0, arch: 0 };
      for (const c of CARDS) counts[c.category] = (counts[c.category] || 0) + 1;
      document.getElementById("chip-all").textContent = `Todas (${counts.all})`;
      document.getElementById("chip-code").textContent = `💻 Código Java & Spring (${counts.code})`;
      document.getElementById("chip-postman").textContent = `🚀 UI Postman (${counts.postman})`;
      document.getElementById("chip-arch").textContent = `🧱 Arquitectura & Despliegue (${counts.arch})`;
    }

    function updateStats() {
      const answered = Object.keys(state.results).length;
      const correct = Object.values(state.results).filter(r => r.status === "ok").length;
      const missed = Object.values(state.results).filter(r => r.status === "bad").length;

      document.getElementById("stat-progress").textContent = `${answered} / ${CARDS.length} respondidas`;
      document.getElementById("stat-score").textContent = `✓ ${correct} aciertos`;
      document.getElementById("stat-streak").textContent = `🔥 Racha: ${state.streak}`;
      document.getElementById("progress-fill").style.width = `${Math.round((answered / CARDS.length) * 100)}%`;

      const missedBtn = document.getElementById("btn-filter-missed");
      missedBtn.textContent = `↻ Por repasar (${missed})`;
      missedBtn.disabled = missed === 0;
      if (missed === 0 && state.filter === "missed") {
        setFilter("all");
      }
    }

    function setFilter(filterName) {
      state.filter = filterName;
      state.currentPos = 0;
      document.querySelectorAll("#filter-group .chip").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filter === filterName);
      });
      renderCard();
    }

    function showSummary() {
      const panel = document.getElementById("summary-panel");
      const grid = document.getElementById("summary-grid");
      const title = document.getElementById("summary-title");
      const subtitle = document.getElementById("summary-subtitle");

      const answered = Object.keys(state.results).length;
      const correct = Object.values(state.results).filter(r => r.status === "ok").length;
      const pct = answered ? Math.round((correct / CARDS.length) * 100) : 0;

      let rank = "En calentamiento — sigue repasando las cartas";
      if (pct >= 90) rank = "Maestro de Pompompurin API 🍣";
      else if (pct >= 70) rank = "Buen dominio — solo ajusta los detalles marcados";
      else if (pct >= 50) rank = "Base sólida — repasa las cartas falladas";

      title.textContent = `Evaluación: ${correct} / ${CARDS.length} (${pct}%)`;
      subtitle.textContent = rank;

      const byCat = {
        code: { name: "Código Java & Spring", total: 0, ok: 0 },
        postman: { name: "UI Postman", total: 0, ok: 0 },
        arch: { name: "Arquitectura & Despliegue", total: 0, ok: 0 }
      };
      for (const c of CARDS) {
        byCat[c.category].total++;
        if (state.results[c.id]?.status === "ok") byCat[c.category].ok++;
      }

      grid.innerHTML = Object.values(byCat).map(cat => `
        <div class="sum-box">
          <small>${cat.name}</small>
          <strong>${cat.ok} / ${cat.total}</strong>
        </div>
      `).join("");

      const missedCount = Object.values(state.results).filter(r => r.status === "bad").length;
      document.getElementById("btn-review-missed").style.display = missedCount > 0 ? "inline-flex" : "none";
      panel.classList.add("visible");
    }

    // Bind global controls
    document.querySelectorAll("#filter-group .chip").forEach(btn => {
      btn.addEventListener("click", () => setFilter(btn.dataset.filter));
    });

    document.getElementById("mode-quiz").addEventListener("click", () => {
      state.mode = "quiz";
      document.getElementById("mode-quiz").classList.add("active");
      document.getElementById("mode-flash").classList.remove("active");
      saveState();
      renderCard();
    });

    document.getElementById("mode-flash").addEventListener("click", () => {
      state.mode = "flash";
      document.getElementById("mode-flash").classList.add("active");
      document.getElementById("mode-quiz").classList.remove("active");
      saveState();
      renderCard();
    });

    document.getElementById("btn-prev").addEventListener("click", () => {
      if (state.currentPos > 0) { state.currentPos--; renderCard(); }
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      const deck = getFilteredCards();
      if (state.currentPos < deck.length - 1) { state.currentPos++; renderCard(); }
    });

    document.getElementById("btn-shuffle").addEventListener("click", () => {
      for (let i = state.order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
      }
      state.currentPos = 0;
      renderCard();
    });

    document.getElementById("btn-summary").addEventListener("click", showSummary);
    document.getElementById("btn-close-summary").addEventListener("click", () => {
      document.getElementById("summary-panel").classList.remove("visible");
    });

    document.getElementById("btn-review-missed").addEventListener("click", () => {
      document.getElementById("summary-panel").classList.remove("visible");
      setFilter("missed");
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      state.results = {};
      state.flipped = {};
      state.pmTabOverride = {};
      state.streak = 0;
      state.order = CARDS.map(c => c.id);
      state.currentPos = 0;
      document.getElementById("summary-panel").classList.remove("visible");
      saveState();
      setFilter("all");
    });

    document.getElementById("btn-theme").addEventListener("click", () => {
      const html = document.documentElement;
      html.dataset.theme = html.dataset.theme === "dark" ? "light" : "dark";
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      const deck = getFilteredCards();
      const card = deck[state.currentPos];
      if (!card) return;

      if (e.key === "ArrowRight" && state.currentPos < deck.length - 1) {
        state.currentPos++;
        renderCard();
      } else if (e.key === "ArrowLeft" && state.currentPos > 0) {
        state.currentPos--;
        renderCard();
      } else if (e.key === " " && state.mode === "flash") {
        e.preventDefault();
        state.flipped[card.id] = !state.flipped[card.id];
        renderCard();
      } else if (state.mode === "quiz" && ["1","2","3","4"].includes(e.key)) {
        const idx = Number(e.key) - 1;
        if (idx < card.options.length && !state.results[card.id]) {
          answerQuiz(card, idx);
        }
      }
    });

    // Init
    loadState();
    updateFilterCounts();
    if (state.mode === "flash") {
      document.getElementById("mode-flash").classList.add("active");
      document.getElementById("mode-quiz").classList.remove("active");
    }
    renderCard();
  </script>
</body>
</html>
